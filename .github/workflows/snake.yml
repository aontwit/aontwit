name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#fe428e&color_dots=#ebedf0,#ffd6e7,#ff9ec4,#ff6aa2,#fe428e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fe428e&color_dots=#161b22,#4a1d3a,#8a2a5e,#c7357a,#fe428e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
